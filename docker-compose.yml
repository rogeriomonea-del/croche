# Uso: docs/DEPLOY.md (caminho A). Só o app: `docker compose up -d --build`.
# Com HTTPS automático pelo Caddy: `docker compose --profile caddy up -d --build`.
services:
  app:
    build: .
    image: mosaic-crochet:latest
    env_file: .env
    volumes:
      # Banco SQLite e backups ficam em ./data no host (dono: uid 1000, o usuário 'node' da imagem).
      - ./data:/data
    ports:
      # Só a própria máquina alcança o app; o acesso público passa pelo Caddy ou pelo nginx.
      - '127.0.0.1:3000:3000'
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: ['caddy']
    depends_on:
      - app
    # Rede do host, e não portas publicadas: a rede padrão do compose é só IPv4, e o Docker repassa
    # quem chega por IPv6 com o IP do gateway (172.x.0.1). Todo visitante IPv6 dividiria um único
    # limite de requisições e de logins. Aqui o Caddy escuta direto nas portas 80/443 do VPS.
    network_mode: host
    environment:
      # Endereço do site no Caddyfile; vem do .env, o mesmo que o app usa.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?defina PUBLIC_ORIGIN no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
